<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">微信 AI 聊天机器人消息架构</title>
  <desc id="desc">微信消息经 WCF 和消息通道进入会话与模型路由，文本由 Gemini 处理，绘图请求由 OpenAI 处理，最后以文本或图片返回微信。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="wechat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #64748b; }
      .node-title { font: 700 22px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .node-copy { font: 400 15px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #64748b; }
      .white-title { font: 700 22px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #ffffff; }
      .white-copy { font: 400 15px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #dcfce7; }
      .label { font: 600 14px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="70" r="150" fill="#c7d2fe" opacity="0.28"/>
  <circle cx="80" cy="660" r="150" fill="#bbf7d0" opacity="0.25"/>
  <text x="70" y="74" class="title">一条消息，如何变成一次智能回复</text>
  <text x="70" y="106" class="subtitle">MESSAGE FLOW · WECHAT / WCF / GEMINI / OPENAI</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="220" height="170" rx="22" fill="url(#wechat)"/>
  </g>
  <circle cx="120" cy="278" r="22" fill="#ffffff" opacity="0.95"/>
  <path d="M108 276h24M108 285h17" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="335" class="white-title">微信消息</text>
  <text x="100" y="365" class="white-copy">私聊 · 群聊 · 绘图指令</text>

  <!-- WCF -->
  <g filter="url(#shadow)">
    <rect x="360" y="230" width="220" height="170" rx="22" fill="#ffffff" stroke="#dbe4f0"/>
  </g>
  <rect x="390" y="258" width="52" height="38" rx="10" fill="#e0e7ff"/>
  <path d="M403 277h26M416 265v25" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  <text x="390" y="335" class="node-title">WCF 通道</text>
  <text x="390" y="365" class="node-copy">接收消息 · 去重 · 会话上下文</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="650" y="230" width="220" height="170" rx="22" fill="url(#router)"/>
  </g>
  <circle cx="700" cy="278" r="22" fill="#ffffff" opacity="0.16"/>
  <path d="M688 278h24M700 266v24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="680" y="335" class="white-title">意图路由</text>
  <text x="680" y="365" class="white-copy">文本对话 / 图片生成</text>

  <!-- Models -->
  <g filter="url(#shadow)">
    <rect x="950" y="150" width="230" height="145" rx="22" fill="#ffffff" stroke="#bfdbfe"/>
  </g>
  <circle cx="995" cy="195" r="20" fill="#dbeafe"/>
  <path d="M995 182v26M982 195h26M986 186l18 18M1004 186l-18 18" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1030" y="201" class="node-title">Gemini</text>
  <text x="980" y="255" class="node-copy">多轮上下文 · System 指令</text>

  <g filter="url(#shadow)">
    <rect x="950" y="360" width="230" height="145" rx="22" fill="#ffffff" stroke="#ddd6fe"/>
  </g>
  <rect x="975" y="390" width="42" height="42" rx="12" fill="#ede9fe"/>
  <circle cx="996" cy="411" r="9" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <path d="M996 396v-7M996 433v-7M981 411h-7M1018 411h-7" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <text x="1030" y="421" class="node-title">OpenAI</text>
  <text x="980" y="468" class="node-copy">图片生成 · URL / Base64</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="1225" y="230" width="125" height="170" rx="22" fill="#0f172a"/>
  </g>
  <text x="1253" y="288" class="white-title">回复</text>
  <text x="1253" y="327" class="white-copy">文本</text>
  <text x="1253" y="355" class="white-copy">图片</text>

  <!-- Flows -->
  <path d="M290 315H350" class="flow"/>
  <path d="M580 315H640" class="flow"/>
  <path d="M870 285C910 285 910 222 940 222" class="flow"/>
  <path d="M870 345C910 345 910 432 940 432" class="flow"/>
  <path d="M1180 222C1205 222 1198 285 1215 285" class="flow"/>
  <path d="M1180 432C1205 432 1198 355 1215 355" class="flow"/>

  <rect x="885" y="178" width="82" height="28" rx="14" fill="#e0e7ff"/>
  <text x="902" y="197" class="label">文本</text>
  <rect x="885" y="402" width="82" height="28" rx="14" fill="#f3e8ff"/>
  <text x="902" y="421" class="label">画图</text>

  <!-- Footer -->
  <rect x="70" y="575" width="1280" height="60" rx="16" fill="#ffffff" opacity="0.82"/>
  <circle cx="103" cy="605" r="7" fill="#22c55e"/>
  <text x="125" y="612" class="node-copy">本地配置与聊天记录不会进入仓库</text>
  <circle cx="478" cy="605" r="7" fill="#6366f1"/>
  <text x="500" y="612" class="node-copy">会话记忆与触发前缀可配置</text>
  <circle cx="865" cy="605" r="7" fill="#8b5cf6"/>
  <text x="887" y="612" class="node-copy">图片结果支持 URL 与本地文件两种返回方式</text>
</svg>
